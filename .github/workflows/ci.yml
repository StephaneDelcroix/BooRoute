name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_NOLOGO: "true"
  NUGET_XMLDOC_MODE: skip

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Run core tests
        run: dotnet test tests/BooRoute.Core.Tests/BooRoute.Core.Tests.csproj --configuration Release

  build-android:
    name: Build Android
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install Android workload
        run: dotnet workload install maui-android --skip-manifest-update

      - name: Build Android
        run: dotnet build src/BooRoute/BooRoute.csproj --configuration Release --framework net11.0-android

  build-apple:
    name: Build iOS and Mac Catalyst
    runs-on: xcode-27
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install MAUI workloads
        run: dotnet workload install maui --skip-manifest-update

      - name: Build iOS
        run: >-
          dotnet build src/BooRoute/BooRoute.csproj
          --configuration Release
          --framework net11.0-ios
          -p:RuntimeIdentifier=iossimulator-arm64

      - name: Build Mac Catalyst
        run: >-
          dotnet build src/BooRoute/BooRoute.csproj
          --configuration Release
          --framework net11.0-maccatalyst
          -p:RuntimeIdentifier=maccatalyst-arm64

  build-windows:
    name: Build Windows
    runs-on: windows-2025-vs2026
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install MAUI workloads
        run: dotnet workload install maui --skip-manifest-update

      - name: Build Windows
        run: dotnet build src/BooRoute/BooRoute.csproj --configuration Release --framework net11.0-windows10.0.19041.0
